<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pizza Tracker</title>

    <!-- Inline pizza-slice favicon (same artwork as the header logo) -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2024%2024%22%3E%3Cg%20fill=%22%23e8923a%22%20stroke=%22%23f4c542%22%20stroke-width=%221.4%22%20stroke-linejoin=%22round%22%3E%3Cpath%20d=%22M12%2012L20.5%2012A8.5%208.5%200%201%201%2012%203.5Z%22/%3E%3Cpath%20d=%22M14.4%209.6L14.4%201.1A8.5%208.5%200%200%201%2022.9%209.6Z%22/%3E%3C/g%3E%3Cg%20fill=%22%23c0392b%22%3E%3Ccircle%20cx=%2215.5%22%20cy=%2215.5%22%20r=%221.05%22/%3E%3Ccircle%20cx=%228.5%22%20cy=%2215.5%22%20r=%221.05%22/%3E%3Ccircle%20cx=%228.5%22%20cy=%228.5%22%20r=%221.05%22/%3E%3Ccircle%20cx=%2211%22%20cy=%2213.5%22%20r=%221.05%22/%3E%3Ccircle%20cx=%2216.8%22%20cy=%227.2%22%20r=%221.05%22/%3E%3Ccircle%20cx=%2215%22%20cy=%229.3%22%20r=%221.05%22/%3E%3C/g%3E%3C/svg%3E"
    />

    <!-- Tailwind CSS v4 (Play CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- HTMX core + SSE and response-targets extensions (current stable 2.x) -->
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx-ext-sse@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx-ext-response-targets@2"></script>
    <!-- Idiomorph htmx extension (pre-1.0 → floating @0); registers the "morph" swap. -->
    <script src="https://cdn.jsdelivr.net/npm/idiomorph@0/dist/idiomorph-ext.min.js"></script>

    <!-- Type: Space Grotesk for display and body text, IBM Plex Mono for small
         labels, ids, chips and buttons. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!--
      Single styling source for the app. Everything is expressed with Tailwind
      utilities (via @apply on semantic component classes; the Go templates stay
      dumb and reuse those class names). The theme is a violet "space" look
      inspired by temporal.io: a deep violet gradient sky with faint stars and a
      fading grid, glass cards, violet as the UI accent, lime for success,
      Space Grotesk + IBM Plex Mono type. The version colours (v1 UV, v2 green,
      v3 amber) are fixed by the demo's colour coding.
      Only what cannot be a utility stays raw CSS: @theme token definitions,
      @keyframes, @property, the layered page backgrounds, the media queries,
      and the stepper and button-ring pseudo-elements (the progress fill is a
      calc() driven by live --fill).
      Illustrations and icons are <symbol>s of the inline SVG sprite at the top
      of <body>; the templates reference them with <use href="#…">.
    -->
    <style type="text/tailwindcss">
      @theme {
        /* ===== Palette =====
           Violet is the UI accent (focus, current step, primary action), lime
           marks success (done steps, live dot) and slateb tints secondary text.
           The version colours are the demo's colour coding: v1 = Temporal UV,
           v2 = green, v3 = amber (amber also = ramping); red = error. Exposed
           as color tokens so utilities (bg-*, text-*, border-*) and
           var(--color-*) references both resolve. */
        --color-base: #0c0a1b; /* page background under the gradients */
        --color-ink: #e5e5e5; /* body text */
        --color-violet: #8b5cf6; /* UI accent */
        --color-lime: #b6f35a; /* success */
        --color-slateb: #7c8fb1; /* secondary text, eyebrow captions */

        --color-uv: #444ce7; /* Temporal UV — v1 */
        --color-green: #16a34a; /* v2 */
        --color-amber: #d97706; /* v3 + ramping */
        --color-red: #dc2626; /* error */

        /* Shared content max width (max-w-app): the header content and the body
           columns use the same cap so their edges line up on wide screens. */
        --container-app: 64rem;

        /* Space Grotesk for text, IBM Plex Mono for labels; system fallbacks. */
        --font-sans: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

        /* Animations (each maps to an animate-* utility). */
        --animate-cur-pulse: cur-pulse 1.5s ease-out infinite;
        --animate-errp: errp 1.2s infinite;
        --animate-card-in: card-in 0.35s ease backwards;
        --animate-card-collapse: card-collapse 0.5s ease 4s forwards;
        --animate-toast-out: toast-out 4s ease forwards;
        --animate-chip-pulse: chip-pulse 0.45s ease;
        --animate-live-dot: live-dot 1.6s ease-out infinite;
        --animate-title-shift: title-shift 6s linear infinite;
        --animate-btn-spin: btn-spin 2.5s linear infinite;
        --animate-pizza-spin: pizza-spin 8s linear infinite;
        --animate-flame-flicker: flame-flicker 0.9s ease-in-out infinite alternate;
        --animate-scooter-bob: scooter-bob 1.4s ease-in-out infinite alternate;
        --animate-drone-hover: drone-hover 1.8s ease-in-out infinite alternate;
        --animate-drone-shake: drone-shake 1.4s ease-in-out infinite;

        /* Violet ring around the current stepper node. */
        @keyframes cur-pulse {
          0% {
            box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.6);
          }
          70% {
            box-shadow: 0 0 0 10px rgba(139, 92, 246, 0);
          }
          100% {
            box-shadow: 0 0 0 0 rgba(139, 92, 246, 0);
          }
        }

        @keyframes errp {
          0% {
            box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.6);
          }
          70% {
            box-shadow: 0 0 0 10px rgba(220, 38, 38, 0);
          }
          100% {
            box-shadow: 0 0 0 0 rgba(220, 38, 38, 0);
          }
        }

        /* Lime ring around the order-publishing toggle's "live" dot. */
        @keyframes live-dot {
          0% {
            box-shadow: 0 0 0 0 rgba(182, 243, 90, 0.6);
          }
          70% {
            box-shadow: 0 0 0 5px rgba(182, 243, 90, 0);
          }
          100% {
            box-shadow: 0 0 0 0 rgba(182, 243, 90, 0);
          }
        }

        @keyframes toast-out {
          0%,
          90% {
            opacity: 1;
          }
          100% {
            opacity: 0;
          }
        }

        @keyframes chip-pulse {
          0% {
            transform: scale(1.18);
            filter: brightness(1.5);
          }
          100% {
            transform: scale(1);
            filter: brightness(1);
          }
        }

        @keyframes card-in {
          from {
            opacity: 0;
            transform: translateY(6px);
          }
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }

        @keyframes card-collapse {
          to {
            max-height: 0;
            margin-bottom: 0;
            padding-top: 0;
            padding-bottom: 0;
            border-width: 0;
            opacity: 0;
            filter: grayscale(1);
          }
        }

        /* Title gradient sweep; its first and last stops match, so the loop is
           seamless. */
        @keyframes title-shift {
          to {
            background-position: -200% center;
          }
        }

        /* Primary button ring: spins the conic gradient's start angle. */
        @keyframes btn-spin {
          to {
            --btn-angle: 360deg;
          }
        }

        /* Order card pizza: one slow turn while the order is in progress. */
        @keyframes pizza-spin {
          to {
            transform: rotate(360deg);
          }
        }

        /* Current-step icon micro-motions (Cook, Out, Drone) and the shake of
           a drone stuck on its failing step. Kept to a pixel or two. */
        @keyframes flame-flicker {
          from {
            transform: scale(1);
            opacity: 1;
          }
          to {
            transform: scale(1.1, 1.18);
            opacity: 0.8;
          }
        }

        @keyframes scooter-bob {
          from {
            transform: translate(-1px, 0);
          }
          to {
            transform: translate(1px, -1px);
          }
        }

        @keyframes drone-hover {
          from {
            transform: translateY(1px);
          }
          to {
            transform: translateY(-1.5px);
          }
        }

        @keyframes drone-shake {
          0%,
          50%,
          100% {
            transform: translateX(0) rotate(0);
          }
          10% {
            transform: translateX(-1.5px) rotate(-8deg);
          }
          20% {
            transform: translateX(1.5px) rotate(8deg);
          }
          30% {
            transform: translateX(-1px) rotate(-5deg);
          }
          40% {
            transform: translateX(1px) rotate(5deg);
          }
        }
      }

      /* Registered so the button ring's conic-gradient angle can animate. */
      @property --btn-angle {
        syntax: "<angle>";
        initial-value: 0deg;
        inherits: false;
      }

      * {
        @apply box-border;
      }

      html {
        @apply [color-scheme:dark];
      }

      html,
      body {
        @apply m-0 h-full;
      }

      body {
        @apply text-ink font-sans antialiased;
      }

      /* ===== Space backdrop =====
         Two violet glows over the base colour, fixed to the viewport, plus two
         fixed decorative layers behind the app: faint stars and a perspective
         grid (temporal.io-inspired). Layered backgrounds and the mask stay raw
         CSS. */
      body {
        background:
          radial-gradient(1200px 500px at 70% -10%, #3b2e8f55, transparent 60%),
          radial-gradient(900px 600px at 10% 0%, #201457, transparent 55%),
          var(--color-base);
        background-attachment: fixed;
      }

      .stars,
      .grid-overlay {
        @apply pointer-events-none fixed inset-0;
      }

      .stars {
        background-image:
          radial-gradient(1px 1px at 20% 30%, #fff6, transparent),
          radial-gradient(1px 1px at 70% 20%, #fff5, transparent),
          radial-gradient(1px 1px at 40% 70%, #fff4, transparent),
          radial-gradient(1px 1px at 85% 60%, #fff5, transparent),
          radial-gradient(1px 1px at 55% 45%, #fff3, transparent);
      }

      /* Grid layer: a temporal.io-inspired perspective grid, fading out from
         mid-page so the bottom of the viewport stays clean. The perspective is
         precomputed into a static SVG (drawn at 1:1 on a 900px-tall viewport,
         bottom-anchored and cropped by the "slice" aspect ratio) because
         WebKit does not reliably paint large 3D-transformed layers. */
      .grid-overlay {
        -webkit-mask-image: linear-gradient(to bottom, #000 45%, transparent 85%);
        mask-image: linear-gradient(to bottom, #000 45%, transparent 85%);
      }

      .grid-overlay svg {
        @apply block size-full;
      }

      /* The SVG sprite only holds <symbol>s: keep it out of layout without
         display:none, so every browser still resolves the <use> references. */
      .sprite {
        @apply absolute size-0 overflow-hidden;
      }

      /* ===== App shell =====
         The header border stays full-bleed, while its content (.top-in) and the
         body (.dbody) are centered at the shared max-w-app width. Both use the
         same 18px side padding, so the logo and attribution line up with the
         column edges. The shell is transparent so the backdrop shows through;
         relative keeps it above the fixed decorative layers. */
      .app {
        @apply relative flex h-dvh flex-col overflow-hidden;
      }

      .top {
        @apply shrink-0 border-b border-white/10 bg-white/[0.02] backdrop-blur-sm;
      }

      .top-in {
        @apply mx-auto flex w-full max-w-app items-center gap-3 px-[18px] py-4;
      }

      /* Title links to the home page; reset the anchor's default underline and
         color. */
      .top .logo {
        @apply flex items-center gap-2.5 no-underline;
      }

      .top .logo .logo-icon {
        @apply shrink-0;
      }

      /* Sweeping violet → blue → lime gradient across the title text. */
      .top .logo .logo-text {
        @apply animate-title-shift bg-[linear-gradient(90deg,#8b5cf6,#5b7cfa,#b6f35a,#5b7cfa,#8b5cf6)]
          bg-[length:200%_auto] bg-clip-text text-[22px] font-semibold leading-none tracking-tight text-transparent;
      }

      /* Right-aligned "powered by" eyebrow caption + Temporal logo lockup. */
      .top .attribution {
        @apply ml-auto flex items-center gap-3 font-mono text-[11px] uppercase tracking-[0.25em] text-slateb;
      }

      /* The logo links to temporal.io; inline-flex keeps the block img
         vertically centered (no inline line-height gap). */
      .top .attribution a {
        @apply inline-flex items-center;
      }

      .top .attribution img {
        @apply block h-8 w-auto;
      }

      /* Read-only ramp percentage shown live in the Deploy modal (amber accent). */
      .pct {
        @apply font-mono font-semibold text-amber;
      }

      /* ===== Body: two flex columns =====
         Centered max-w-app row: a flexible orders column (.dleft) and a
         deployment column (.dright) that is 360px on desktop and shrinks to
         300px on tablet widths so the orders column keeps room. Both are
         transparent over the backdrop, with no divider between them. Stacks
         on mobile. */
      .dbody {
        @apply mx-auto flex min-h-0 w-full max-w-app flex-1;
      }

      .dleft {
        @apply flex min-h-0 min-w-0 flex-1 flex-col overflow-y-auto px-[18px] py-5 [scrollbar-gutter:stable];
      }

      .dright {
        @apply min-h-0 w-[clamp(300px,36%,360px)] min-w-0 shrink-0 overflow-y-auto px-[18px] py-5
          [scrollbar-gutter:stable];
      }

      .sect {
        @apply mb-[13px] flex font-mono text-[11px] uppercase tracking-[0.2em] text-neutral-500;
      }

      .sect .count {
        @apply ml-auto font-semibold;
      }

      /* Live orders header: the .sect label plus the order-publishing toggle
         pushed right. Its negative vertical margin keeps the row as tall as a
         bare .sect, so both columns' first cards line up. */
      .sect-row {
        @apply mb-[13px] flex items-center gap-3;
      }

      .sect-row .sect {
        @apply mb-0;
      }

      .publishing {
        @apply -my-1.5 ml-auto flex;
      }

      /* Mono pill with a tinted border: running = pulsing lime dot; paused =
         amber with a static pause glyph. Disables itself while its request
         runs. */
      .pub-btn {
        @apply inline-flex cursor-pointer items-center gap-2 rounded-full border border-slateb/25 bg-white/5 px-3
          py-1 font-mono text-[11px] leading-none text-neutral-100 backdrop-blur-sm transition-colors;
      }

      .pub-btn:hover:not(:disabled) {
        @apply bg-white/10;
      }

      .pub-btn:disabled {
        @apply cursor-progress opacity-60;
      }

      .pub-dot {
        @apply size-1.5 shrink-0 animate-live-dot rounded-full bg-lime;
      }

      .pub-btn.paused {
        @apply border-amber-400/30 bg-amber-400/10 text-amber-300;
      }

      .pub-btn.paused:hover:not(:disabled) {
        @apply bg-amber-400/20;
      }

      /* Pause glyph: two vertical bars drawn by the side borders. */
      .pub-btn.paused .pub-dot {
        @apply h-2 w-[7px] animate-none rounded-none border-x-2 border-amber-300 bg-transparent;
      }

      /* Keyboard focus: a violet ring on every control (the primary button
         shows its gradient ring instead). */
      .pub-btn:focus-visible,
      .recover-btn:focus-visible,
      .btn:focus-visible,
      .radio:has(input:focus-visible) {
        @apply outline-2 outline-offset-2 outline-violet;
      }

      /* ===== Live orders list ===== */
      .olist {
        @apply shrink-0;
      }

      /* Shown in place of the cards while publishing is paused and none remain:
         a dashed glass panel with a sleeping pizza box above the message. */
      .orders-empty {
        @apply flex flex-col items-center gap-3 rounded-xl border border-dashed border-white/15 bg-white/[0.02] p-10
          text-center text-sm text-neutral-500;
      }

      .orders-empty p {
        @apply m-0;
      }

      .orders-empty-art {
        @apply h-12 w-16 fill-none stroke-slateb stroke-[1.6] [stroke-linecap:round] [stroke-linejoin:round];
      }

      /* Mobile (<=760px): the whole app scrolls and the columns stack with the
         deployment panel on top. @apply cannot emit media queries in the Play
         CDN, so these responsive overrides stay as raw CSS. */
      @media (max-width: 760px) {
        .app {
          overflow-y: auto;
        }

        .dbody {
          flex-direction: column;
          overflow: visible;
        }

        .dleft {
          overflow: visible;
        }

        .dright {
          width: auto;
          order: -1;
          overflow: visible;
          scrollbar-gutter: auto;
        }

        /* Pizza name hidden on small screens to keep the header compact. */
        .oh .nm {
          display: none;
        }

        /* Attribution text hidden on small screens; the Temporal logo stays. */
        .top .attribution span {
          display: none;
        }
      }

      /* ===== Version badges + status chips ===== */
      .vb {
        @apply rounded-full px-2 py-0.5 font-mono text-[11px] font-semibold text-white;
      }

      .b-v1 {
        @apply bg-uv;
      }

      .b-v2 {
        @apply bg-green;
      }

      .b-v3 {
        @apply bg-amber;
      }

      /* Status chips: mono pills with a tinted border and background. */
      .chip {
        @apply rounded-full border px-2.5 py-0.5 font-mono text-[10px] font-medium tracking-wide
          animate-chip-pulse;
      }

      .c-cur {
        @apply border-violet/40 bg-violet/15 text-violet-300;
      }

      .c-ramp {
        @apply border-amber/50 bg-amber/15 text-amber-300;
      }

      .c-drain {
        @apply border-slateb/30 bg-slateb/10 text-slateb;
      }

      .c-inact {
        @apply border-white/10 bg-white/5 text-neutral-400;
      }

      /* ===== Order card + stepper ===== */
      /* Glass card; hover only tints the border violet — no lift, no shadow.
         max-h is the start of the Done collapse: it sits just above the tallest
         card (~150px, with a wrapped header on phones) so the height starts
         shrinking as soon as the card fades, instead of leaving a blank block. */
      .order {
        @apply mb-3 max-h-[220px] animate-card-in rounded-xl border border-white/10 bg-white/[0.04] p-[14px_16px]
          backdrop-blur-sm transition-[border-color,background-color] duration-[180ms];
      }

      .order:hover {
        @apply border-violet/40;
      }

      /* Failing order: red-tinted glass, keeping its red identity on hover. */
      .order.fail {
        @apply border-red/40 bg-red/[0.07];
      }

      .order.fail:hover {
        @apply border-red/70;
      }

      /* Done → visible-then-collapse with no JS: full for 4s, then card-collapse
         shrinks height + bottom margin to 0 so cards below glide up. */
      .order.done {
        @apply animate-card-collapse overflow-hidden;
      }

      .oh {
        @apply mb-4 flex flex-wrap items-center gap-2 text-[13px];
      }

      .oh b {
        @apply font-mono font-medium text-neutral-100;
      }

      .oh .nm {
        @apply text-neutral-400;
      }

      .oh .el {
        @apply ml-auto font-mono text-[11px] text-slateb;
      }

      /* Pizza illustration (natural colours): turns slowly while the order is
         in progress, and freezes where it stands once the order fails or is
         delivered. */
      .oh .pz {
        @apply size-7 shrink-0 animate-pizza-spin;
      }

      .order.fail .pz {
        @apply opacity-75 grayscale-[0.6] [animation-play-state:paused];
      }

      .order.done .pz {
        @apply drop-shadow-[0_0_6px_rgba(182,243,90,0.6)] [animation-play-state:paused];
      }

      /* Per-card recover action: an amber mono pill shown on a failing order
         just right of the version badge. Disables itself while its request
         runs. */
      .recover-btn {
        @apply inline-flex shrink-0 cursor-pointer items-center justify-center rounded-full border
          border-amber-400/40 bg-amber-400/10 px-2.5 py-0.5 font-mono text-[11px] font-medium leading-none
          text-amber-300 transition-colors;
      }

      .recover-btn:hover:not(:disabled) {
        @apply bg-amber-400/20;
      }

      .recover-btn:disabled {
        @apply cursor-progress opacity-60;
      }

      /* Reserve vertical room (pb) for the absolutely-positioned labels. */
      .stepper {
        @apply relative flex justify-between pb-[18px];
      }

      /* Connector track + progress fill — pseudo-elements centred on the 28px
         dots; the fill width is a calc() driven by the live --fill custom
         property, so these stay raw CSS. */
      .stepper::before,
      .stepper::after {
        content: "";
        position: absolute;
        top: 12.5px;
        left: 14px;
        height: 3px;
        border-radius: 2px;
      }

      .stepper::before {
        right: 14px;
        background: rgba(255, 255, 255, 0.1);
      }

      .stepper::after {
        width: calc((100% - 28px) * var(--fill, 0) / 100);
        background: var(--color-lime);
        transition: width 0.6s ease;
      }

      .node {
        @apply relative z-[1] flex flex-none flex-col items-center;
      }

      /* The pending dot is opaque so the connector track does not show through. */
      .dot {
        @apply flex size-7 items-center justify-center rounded-full border-2 border-white/15 bg-[#16132c]
          text-neutral-500 transition-colors duration-[400ms];
      }

      /* Step icons are line art drawn in the dot's text colour. */
      .dot svg {
        @apply size-4 fill-none stroke-current stroke-2 [stroke-linecap:round] [stroke-linejoin:round];
      }

      .lbl {
        @apply absolute left-1/2 top-full mt-[7px] w-max max-w-[84px] -translate-x-1/2 text-center font-mono
          text-[10px] leading-[1.1] text-neutral-600 transition-colors duration-[400ms];
      }

      /* Anchor the end labels inward so they never overflow the card edge. */
      .node:first-child .lbl {
        @apply left-0 translate-x-0 text-left;
      }

      .node:last-child .lbl {
        @apply left-auto right-0 translate-x-0 text-right;
      }

      .node.done .dot {
        @apply border-lime bg-lime text-[#0c0a1b];
      }

      .node.done .lbl {
        @apply text-lime/80;
      }

      .node.cur .dot {
        @apply animate-cur-pulse border-violet bg-violet text-white;
      }

      .node.cur .lbl {
        @apply font-medium text-violet;
      }

      /* Per-step micro-motion on the current node's icon; the step-* modifier
         class is the icon's sprite id, set by the template. */
      .node.cur.step-cook .dot svg {
        @apply origin-bottom animate-flame-flicker;
      }

      .node.cur.step-out .dot svg {
        @apply animate-scooter-bob;
      }

      .node.cur.step-drone .dot svg {
        @apply animate-drone-hover;
      }

      .node.err .dot {
        @apply animate-errp border-red bg-red text-white;
      }

      .node.err .lbl {
        @apply font-medium text-red-400;
      }

      .node.err.step-drone .dot svg {
        @apply animate-drone-shake;
      }

      /* Reduced motion: disable smoothing/entry; Done still collapses (snaps). */
      @media (prefers-reduced-motion: reduce) {
        .order {
          animation: none;
          transition: none;
        }

        .order.done {
          animation: card-collapse 0.01s linear 4s forwards;
        }

        .stepper::after,
        .dot,
        .lbl {
          transition: none;
        }

        .oh .pz,
        .dot svg,
        .top .logo .logo-text,
        .btn.primary::before {
          animation: none;
        }

        .ver,
        .bar > span,
        .chip,
        .pub-btn,
        .pub-dot {
          transition: none;
          animation: none;
        }
      }

      /* ===== Deployment panel ===== */
      /* Glass card; the 3px left accent takes the colour of its version badge. */
      .ver {
        @apply mb-[11px] rounded-xl border border-l-[3px] border-white/10 border-l-uv bg-white/[0.04] p-3
          backdrop-blur-sm;
        transition: opacity 0.3s ease;
      }

      .ver:has(.vb.b-v2) {
        @apply border-l-green;
      }

      .ver:has(.vb.b-v3) {
        @apply border-l-amber;
      }

      .ver.inactive {
        @apply opacity-55;
      }

      .vrow {
        @apply mb-[10px] flex flex-wrap items-center gap-[7px] text-[12px];
      }

      .vrow .chip {
        @apply ml-auto;
      }

      .bar {
        @apply h-1.5 overflow-hidden rounded-full bg-white/10;
      }

      .bar > span {
        @apply block h-full w-[var(--bar-w,0)] rounded-full;
        transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .pin {
        @apply mt-2 font-mono text-[11px] text-slateb;
      }

      /* ===== Buttons ===== */
      .controls {
        @apply mt-4 flex gap-2;
      }

      .controls .btn {
        @apply mt-0 flex-1;
      }

      .btn {
        @apply relative mt-[9px] cursor-pointer rounded-lg border border-white/10 bg-white/5 px-3 py-2.5 text-center
          font-mono text-[12px] font-medium text-neutral-100 backdrop-blur-sm transition;
      }

      .btn:hover:not(:disabled) {
        @apply bg-white/10;
      }

      .btn:disabled {
        @apply cursor-not-allowed opacity-45;
      }

      .btn.danger {
        @apply border-red/40 bg-red/10 text-red-400;
      }

      .btn.danger:hover:not(:disabled) {
        @apply bg-red/20;
      }

      /* Primary: violet → blue gradient with a violet glow. */
      .btn.primary {
        @apply border-transparent bg-[linear-gradient(100deg,#8b5cf6,#5b7cfa)] text-white
          shadow-[0_0_30px_-6px_#8b5cf6];
      }

      .btn.primary:focus-visible {
        @apply outline-none;
      }

      /* Hover/focus ring of the primary button: a spinning conic gradient kept
         to a 3px ring by the mask. Pseudo-element + mask compositing, so raw
         CSS. */
      .btn.primary::before {
        content: "";
        position: absolute;
        inset: -3px;
        border-radius: 11px;
        padding: 3px;
        background: conic-gradient(from var(--btn-angle), #8b5cf6, #22d3ee, #b6f35a, #22d3ee, #8b5cf6);
        -webkit-mask:
          linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        mask:
          linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        filter: drop-shadow(0 0 5px rgba(34, 211, 238, 0.55));
        opacity: 0;
        transition: opacity 0.2s ease;
        pointer-events: none;
      }

      .btn.primary:hover:not(:disabled)::before,
      .btn.primary:focus-visible::before {
        @apply animate-btn-spin opacity-100;
      }

      /* ===== Toast ===== */
      /* Sized to its message but capped to the viewport minus 18px margins, so a
         long message wraps instead of overflowing narrow screens. Stacked above
         the modal scrim (z-50) because Deploy/Rollback errors surface here
         while the modal stays open. */
      .toast {
        @apply pointer-events-none fixed bottom-[18px] left-1/2 z-[60] w-max max-w-[calc(100vw-36px)]
          -translate-x-1/2 rounded-lg border border-red/40 bg-[#2a0f1c]/90 px-4 py-2.5 text-center font-mono
          text-[12px] text-red-300 opacity-0 backdrop-blur-sm;
      }

      /* Swapped in as <div class="toast show">…</div>; fades out after ~4s, no JS. */
      .toast.show {
        @apply animate-toast-out opacity-100;
      }

      /* ===== Deploy modal ===== */
      /* The scrim's padding keeps a margin around the modal on phones. */
      .modal-scrim {
        @apply fixed inset-0 z-50 flex items-center justify-center bg-base/70 p-4 backdrop-blur-sm;
      }

      /* Opaque dark-violet surface: a backdrop-filter nested inside the blurred
         scrim does not blur the page, so a translucent fill would let the cards
         show through sharply. */
      .modal {
        @apply w-full max-w-[360px] rounded-xl border border-white/10 bg-[linear-gradient(180deg,#1a1633,#131027)] p-7
          shadow-[0_20px_60px_-20px_rgba(139,92,246,0.45)];
      }

      /* Phones (<=420px): tighter modal padding. Raw CSS, as @apply cannot emit
         media queries in the Play CDN. */
      @media (max-width: 420px) {
        .modal {
          padding: 20px;
        }
      }

      .modal h3 {
        @apply m-0 mb-2 text-xl font-semibold tracking-tight text-white;
      }

      .modal-note {
        @apply mt-5 text-xs leading-relaxed text-neutral-400;
      }

      .modal-lbl {
        @apply mt-5 mb-2 flex justify-between font-mono text-[11px] uppercase tracking-[0.2em] text-neutral-500;
      }

      .radios {
        @apply flex gap-2.5;
      }

      .radio {
        @apply flex-1 cursor-pointer rounded-lg border border-white/10 bg-white/5 py-2.5 text-center
          transition-colors;
      }

      .radio:has(input:checked) {
        @apply border-violet bg-violet/15;
      }

      .radio:not(:has(input:checked)):hover {
        @apply border-white/20 bg-white/10;
      }

      /* Visually hidden rather than display:none, so the radios stay reachable
         by keyboard and the focus ring shows on their label. */
      .radio input {
        @apply sr-only;
      }

      /* Modal range input: 3 reachable stops (25/50/100) via min=0 max=2. */
      .stepper-range {
        @apply block w-full accent-amber;
      }

      .modal-acts {
        @apply mt-5 flex gap-2.5;
      }

      .modal-acts .btn {
        @apply flex-1;
      }
    </style>
  </head>

          <div class="olist" id="orders" sse-swap="orders" hx-swap="morph:innerHTML"></div>
        </section>

        <aside class="dright">
          <div class="sect">Workflows</div>
          <div id="versions" sse-swap="versions" hx-swap="morph:innerHTML"></div>

          <!-- Controls row, streamed server-side via SSE (sse-swap="controls")
               and morphed in place like #orders, so button nodes, htmx bindings
               and focus are preserved. The server re-renders both buttons every
               frame. Deploy is disabled with fewer than two versions; Rollback
               is disabled unless a version is currently ramping. (Recovery is
               now a per-card amber "Fix" text button shown on a failing order,
               not a control here.) -->
          <div class="controls" id="controls" sse-swap="controls" hx-swap="morph:innerHTML"></div>
        </aside>
      </div>
    </div>

    <!-- Single modal host. A modal is open when the server has swapped a
         .modal-scrim fragment in here, closed when it is emptied — no JS, no
         hidden toggling. Deploy/Rollback (in the controls row) GET their modal
         fragment into this host; Cancel and Escape DELETE /modal to clear it.
         The Deploy form posts /deploy and the server decides promote vs
         ramp; success returns an empty 200 that clears the host (closing the
         modal), while errors route to #toast (response-targets) so the modal
         stays open. The host sits outside every sse-swap region, so SSE frames
         never touch it. -->
    <div id="modal-host"></div>

    <!-- Action results and errors are swapped here as toast fragments. The
         Deploy/Rollback buttons live in the Deployment column controls row, and
         each failing order card carries a per-card "Fix" (recover) button; all
         surface success and error responses here via #toast. -->
    <div id="toast" hx-target="#toast" hx-target-error="#toast"></div>
  </body>
</html>
